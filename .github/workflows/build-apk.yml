name: Build React to Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Permanent Android Keystore
        run: |
          if [ ! -f android/app/kifayat-release.jks ]; then
            mkdir -p android/app
            keytool -genkeypair -v \
              -keystore android/app/kifayat-release.jks \
              -storepass kifayat2026 \
              -keypass kifayat2026 \
              -alias kifayatconnect \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Kifayat Connect, OU=Mobile Engineering, O=Kifayat Connect, L=Islamabad, ST=ICT, C=PK"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/kifayat-release.jks
            git commit -m "chore(android): commit permanent release keystore [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Permanent keystore android/app/kifayat-release.jks already exists; reusing it."
          fi

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: Convert Web App to Android with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.kifayatconnect.app", "appName": "Kifayat Connect", "webDir": "dist"}' > capacitor.config.json
          fi
          if [ ! -f "android/gradlew" ]; then
            mkdir -p /tmp/kc_android_preserve
            if [ -f "android/app/build.gradle" ]; then
              cp android/app/build.gradle /tmp/kc_android_preserve/build.gradle
            fi
            if [ -f "android/app/kifayat-release.jks" ]; then
              cp android/app/kifayat-release.jks /tmp/kc_android_preserve/kifayat-release.jks
            fi
            if ls -d android/app/src/main/res/mipmap-* >/dev/null 2>&1; then
              mkdir -p /tmp/kc_android_preserve/res
              cp -r android/app/src/main/res/mipmap-* /tmp/kc_android_preserve/res/
            fi
            rm -rf android
            npx cap add android
            if [ -f "/tmp/kc_android_preserve/build.gradle" ]; then
              cp /tmp/kc_android_preserve/build.gradle android/app/build.gradle
            fi
            if [ -f "/tmp/kc_android_preserve/kifayat-release.jks" ]; then
              cp /tmp/kc_android_preserve/kifayat-release.jks android/app/kifayat-release.jks
            fi
            if ls -d /tmp/kc_android_preserve/res/mipmap-* >/dev/null 2>&1; then
              rm -rf android/app/src/main/res/mipmap-*
              cp -r /tmp/kc_android_preserve/res/mipmap-* android/app/src/main/res/
            fi
            rm -rf /tmp/kc_android_preserve
          fi
          npx cap sync android

      - name: Build & Rename Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mv android/app/build/outputs/apk/debug/app-debug.apk "KifayatConnect-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KifayatConnect-v1.0.${{ github.run_number }}
          path: KifayatConnect-v1.0.${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kifayat Connect v1.0.${{ github.run_number }}
          body: |
            Automated Android APK release for Kifayat Connect (v1.0.${{ github.run_number }}).
            Built from commit ${{ github.sha }}.
          files: KifayatConnect-v1.0.${{ github.run_number }}.apk
