name: Build React to Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: Convert Web App to Android with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.kifayatconnect.app", "appName": "Kifayat Connect", "webDir": "dist"}' > capacitor.config.json
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          grep -q "kotlin-stdlib-jdk7" android/app/build.gradle || echo 'configurations.all { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" }' >> android/app/build.gradle

      - name: Build & Rename Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mv android/app/build/outputs/apk/debug/app-debug.apk "KifayatConnect-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KifayatConnect-v1.0.${{ github.run_number }}
          path: KifayatConnect-v1.0.${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kifayat Connect v1.0.${{ github.run_number }}
          body: |
            Automated Android APK release for Kifayat Connect (v1.0.${{ github.run_number }}).
            Built from commit ${{ github.sha }}.
          files: KifayatConnect-v1.0.${{ github.run_number }}.apk
