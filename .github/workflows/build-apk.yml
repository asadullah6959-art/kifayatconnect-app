name: Build React to Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ski-release.jks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure stable release signing
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "android/app/$ANDROID_KEYSTORE_FILE"
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: Convert Web App to Android with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.suikhelittehad.app", "appName": "SUI KHEL ITTEHAD", "webDir": "dist"}' > capacitor.config.json
          fi
          if [ ! -f "android/gradlew" ]; then
            mkdir -p /tmp/kc_android_preserve
            if [ -f "android/app/build.gradle" ]; then
              cp android/app/build.gradle /tmp/kc_android_preserve/build.gradle
            fi
            if [ -f "android/app/ski-release.jks" ]; then
              cp android/app/ski-release.jks /tmp/kc_android_preserve/ski-release.jks
            fi
            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              cp android/app/src/main/AndroidManifest.xml /tmp/kc_android_preserve/AndroidManifest.xml
            fi
            if [ -f "android/app/src/main/java/com/suikhelittehad/app/MainActivity.java" ]; then
              cp android/app/src/main/java/com/suikhelittehad/app/MainActivity.java /tmp/kc_android_preserve/MainActivity.java
            fi
            if ls -d android/app/src/main/res/mipmap-* >/dev/null 2>&1; then
              mkdir -p /tmp/kc_android_preserve/res
              cp -r android/app/src/main/res/mipmap-* /tmp/kc_android_preserve/res/
            fi
            if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
              mkdir -p /tmp/kc_android_preserve/res/values
              cp android/app/src/main/res/values/ic_launcher_background.xml /tmp/kc_android_preserve/res/values/ic_launcher_background.xml
            fi
            if [ -d "android/app/src/main/res/xml" ]; then
              mkdir -p /tmp/kc_android_preserve/res
              cp -r android/app/src/main/res/xml /tmp/kc_android_preserve/res/
            fi
            rm -rf android
            npx cap add android
            if [ -f "/tmp/kc_android_preserve/build.gradle" ]; then
              cp /tmp/kc_android_preserve/build.gradle android/app/build.gradle
            fi
            if [ -f "/tmp/kc_android_preserve/ski-release.jks" ]; then
              cp /tmp/kc_android_preserve/ski-release.jks android/app/ski-release.jks
            fi
            if [ -f "/tmp/kc_android_preserve/AndroidManifest.xml" ]; then
              cp /tmp/kc_android_preserve/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            fi
            if [ -f "/tmp/kc_android_preserve/MainActivity.java" ]; then
              mkdir -p android/app/src/main/java/com/suikhelittehad/app
              cp /tmp/kc_android_preserve/MainActivity.java android/app/src/main/java/com/suikhelittehad/app/MainActivity.java
            fi
            if ls -d /tmp/kc_android_preserve/res/mipmap-* >/dev/null 2>&1; then
              rm -rf android/app/src/main/res/mipmap-*
              cp -r /tmp/kc_android_preserve/res/mipmap-* android/app/src/main/res/
            fi
            if [ -f "/tmp/kc_android_preserve/res/values/ic_launcher_background.xml" ]; then
              mkdir -p android/app/src/main/res/values
              cp /tmp/kc_android_preserve/res/values/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
            fi
            if [ -d "/tmp/kc_android_preserve/res/xml" ]; then
              mkdir -p android/app/src/main/res
              cp -r /tmp/kc_android_preserve/res/xml android/app/src/main/res/
            fi
            rm -rf /tmp/kc_android_preserve
          fi
          npx cap sync android

      - name: Build & Rename Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mv android/app/build/outputs/apk/debug/app-debug.apk "SUI-KHEL-ITTEHAD-debug-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUI-KHEL-ITTEHAD-debug-v1.0.${{ github.run_number }}
          path: SUI-KHEL-ITTEHAD-debug-v1.0.${{ github.run_number }}.apk

      - name: Build signed release APK
        if: steps.signing.outputs.release_enabled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd android
          ./gradlew assembleRelease
          cd ..
          mv android/app/build/outputs/apk/release/app-release.apk "SUI-KHEL-ITTEHAD-v1.0.${{ github.run_number }}.apk"

      - name: Publish APK to GitHub Releases
        if: steps.signing.outputs.release_enabled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SUI KHEL ITTEHAD v1.0.${{ github.run_number }}
          body: |
            Automated Android APK release for SUI KHEL ITTEHAD (v1.0.${{ github.run_number }}).
            Built from commit ${{ github.sha }}.
          files: SUI-KHEL-ITTEHAD-v1.0.${{ github.run_number }}.apk
