name: Build React to Android APK

on:
  push:
    branches: [ main, appjet ]
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run that is already signing/publishing: each run owns exactly
# one versionCode, and a half-published release is worse than a queued build.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

env:
  # ---- Permanent app identity and signing (must never change) ----
  APPLICATION_ID: com.kifayatconnect.app
  KC_KEYSTORE_FILE: android/app/kifayat-release.jks
  KC_KEY_ALIAS: kifayatconnect
  # Committed keystore password. Set the repository secret KC_KEYSTORE_PASSWORD
  # (same value) to take precedence if you later rotate it.
  KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD || 'kifayat2026' }}
  # SHA-256 of the signing certificate inside that keystore, colons removed.
  # If a build ever produces a different key, in-place updates break, so the
  # build stops instead of publishing an APK that forces an uninstall.
  KC_EXPECTED_CERT_SHA256: "2b6a0bf76e0e07944b2b29b0a1c7a07abce78d7bc440230578b3f76907132dcc"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # A random or regenerated keystore is the single most common cause of
      # "app not installed" on update, so this step never creates one.
      - name: Verify permanent release keystore
        run: |
          set -euo pipefail
          if [ ! -f "$KC_KEYSTORE_FILE" ]; then
            echo "::error file=$KC_KEYSTORE_FILE::Release keystore is missing. Generating a new one would change the app signature and force every installed user to uninstall. Restore the committed keystore."
            exit 1
          fi
          ACTUAL=$(keytool -list -v -keystore "$KC_KEYSTORE_FILE" \
                     -storepass "$KC_KEYSTORE_PASSWORD" -alias "$KC_KEY_ALIAS" \
                   | grep -i 'SHA256:' | head -1 \
                   | sed 's/.*SHA256: *//' | tr -d ' :[:space:]' | tr 'A-F' 'a-f')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the signing certificate. Check the keystore password and alias."
            exit 1
          fi
          if [ "$ACTUAL" != "$KC_EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Expected $KC_EXPECTED_CERT_SHA256 but found $ACTUAL. Publishing this APK would force users to uninstall."
            exit 1
          fi
          echo "Signing certificate verified: $ACTUAL"

      # versionCode = 1000 + runNumber*10 + attempt
      #   strictly increases across builds and across re-runs of the same build,
      #   stays above legacy runNumber+100 codes, and keeps the release tag
      #   unique per attempt so a re-run never collides with an existing tag.
      - name: Compute monotonic version
        id: ver
        run: |
          set -euo pipefail
          RUN="${{ github.run_number }}"
          ATTEMPT="${{ github.run_attempt }}"
          [ -n "$ATTEMPT" ] || ATTEMPT=1
          BUMP="$ATTEMPT"
          if [ "$BUMP" -gt 9 ]; then BUMP=9; fi
          CODE=$((1000 + RUN * 10 + BUMP))
          if [ "$ATTEMPT" -gt 1 ]; then NAME="1.0.${RUN}.${ATTEMPT}"; else NAME="1.0.${RUN}"; fi
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building $APPLICATION_ID versionName=$NAME versionCode=$CODE"

      - name: Assert package id is locked
        run: |
          set -euo pipefail
          FOUND=$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*"\?\([^"[:space:]]*\)"\?.*/\1/p' android/app/build.gradle | head -1)
          if [ "$FOUND" != "$APPLICATION_ID" ]; then
            echo "::error file=android/app/build.gradle::applicationId is '$FOUND' but must stay '$APPLICATION_ID'; changing it installs a second app instead of updating."
            exit 1
          fi
          if [ -f capacitor.config.json ]; then
            CAP=$(node -e "console.log(require('./capacitor.config.json').appId || '')")
            if [ "$CAP" != "$APPLICATION_ID" ]; then
              echo "::error file=capacitor.config.json::appId is '$CAP' but must stay '$APPLICATION_ID'."
              exit 1
            fi
          fi
          echo "Package id locked to $APPLICATION_ID"

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: Convert Web App to Android with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.kifayatconnect.app", "appName": "Kifayat Connect", "webDir": "dist"}' > capacitor.config.json
          fi
          if [ ! -f "android/gradlew" ]; then
            mkdir -p /tmp/kc_android_preserve
            if [ -f "android/app/build.gradle" ]; then
              cp android/app/build.gradle /tmp/kc_android_preserve/build.gradle
            fi
            if [ -f "android/app/kifayat-release.jks" ]; then
              cp android/app/kifayat-release.jks /tmp/kc_android_preserve/kifayat-release.jks
            fi
            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              cp android/app/src/main/AndroidManifest.xml /tmp/kc_android_preserve/AndroidManifest.xml
            fi
            if [ -f "android/app/src/main/java/com/kifayatconnect/app/MainActivity.java" ]; then
              cp android/app/src/main/java/com/kifayatconnect/app/MainActivity.java /tmp/kc_android_preserve/MainActivity.java
            fi
            if ls -d android/app/src/main/res/mipmap-* >/dev/null 2>&1; then
              mkdir -p /tmp/kc_android_preserve/res
              cp -r android/app/src/main/res/mipmap-* /tmp/kc_android_preserve/res/
            fi
            if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
              mkdir -p /tmp/kc_android_preserve/res/values
              cp android/app/src/main/res/values/ic_launcher_background.xml /tmp/kc_android_preserve/res/values/ic_launcher_background.xml
            fi
            rm -rf android
            npx cap add android
            if [ -f "/tmp/kc_android_preserve/build.gradle" ]; then
              cp /tmp/kc_android_preserve/build.gradle android/app/build.gradle
            fi
            if [ -f "/tmp/kc_android_preserve/kifayat-release.jks" ]; then
              cp /tmp/kc_android_preserve/kifayat-release.jks android/app/kifayat-release.jks
            fi
            if [ -f "/tmp/kc_android_preserve/AndroidManifest.xml" ]; then
              cp /tmp/kc_android_preserve/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            fi
            if [ -f "/tmp/kc_android_preserve/MainActivity.java" ]; then
              mkdir -p android/app/src/main/java/com/kifayatconnect/app
              cp /tmp/kc_android_preserve/MainActivity.java android/app/src/main/java/com/kifayatconnect/app/MainActivity.java
            fi
            if ls -d /tmp/kc_android_preserve/res/mipmap-* >/dev/null 2>&1; then
              rm -rf android/app/src/main/res/mipmap-*
              cp -r /tmp/kc_android_preserve/res/mipmap-* android/app/src/main/res/
            fi
            if [ -f "/tmp/kc_android_preserve/res/values/ic_launcher_background.xml" ]; then
              mkdir -p android/app/src/main/res/values
              cp /tmp/kc_android_preserve/res/values/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
            fi
            rm -rf /tmp/kc_android_preserve
          fi
          npx cap sync android
          # cap add/sync can rewrite the app module; confirm the locked identity
          # and the permanent keystore survived before compiling.
          grep -q "applicationId \"$APPLICATION_ID\"" android/app/build.gradle || {
            echo "::error::applicationId was altered during cap sync; refusing to build."
            exit 1
          }
          [ -f "$KC_KEYSTORE_FILE" ] || {
            echo "::error::Keystore missing after cap sync; refusing to build."
            exit 1
          }

      - name: Build & verify signed release APK
        env:
          KC_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          KC_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PkcVersionCode="$KC_VERSION_CODE" \
            -PkcVersionName="$KC_VERSION_NAME"
          cd ..
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          SIGNER=$(ls ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$SIGNER" ] && [ -x "$SIGNER" ]; then
            DIGEST=$("$SIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
            if [ -n "$DIGEST" ] && [ "$DIGEST" != "$KC_EXPECTED_CERT_SHA256" ]; then
              echo "::error::The built APK is signed by $DIGEST, not the pinned release key. Users would be forced to uninstall."
              exit 1
            fi
            echo "APK signature verified against the pinned release key."
          else
            echo "apksigner unavailable on this runner; the certificate was verified against the keystore before the build."
          fi
          mv "$APK" "KifayatConnect-${KC_VERSION_NAME}.apk"
          echo "Produced KifayatConnect-${KC_VERSION_NAME}.apk (versionCode $KC_VERSION_CODE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KifayatConnect-${{ steps.ver.outputs.version_name }}
          path: KifayatConnect-${{ steps.ver.outputs.version_name }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: Kifayat Connect v${{ steps.ver.outputs.version_name }}
          body: |
            Automated signed Android APK for Kifayat Connect (v${{ steps.ver.outputs.version_name }}).

            - Package id: `com.kifayatconnect.app` (unchanged)
            - versionCode: `${{ steps.ver.outputs.version_code }}` — installs as an update over any earlier version
            - Signed with the permanent release key, so no uninstall is needed

            Built from commit ${{ github.sha }}.
          files: KifayatConnect-${{ steps.ver.outputs.version_name }}.apk
