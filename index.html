<!doctype html>
<html lang="en" class="dark" style="background-color:#070D14;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kifayat Connect – Luxury Community Governance & Welfare System</title>
    <meta name="description" content="Multi-tier role-based governance system for Kifayat Connect with Super Admin, Admin, Co-Admin, and Member dashboards, Office-Bearers, VIP Digital ID, and Real-Time Chat." />
    <meta property="og:title" content="Kifayat Connect – Luxury Community Governance & Welfare System" />
    <meta property="og:description" content="Together for a Better Tomorrow — Community Governance and Welfare Management for Pakistan." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#070D14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kifayat Connect" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./kc-emblem.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #070D14;
        color: #F8FAFC;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .kc-boot-shell {
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
        background: radial-gradient(circle at 50% 22%, rgba(56, 189, 248, 0.12) 0%, #0D1624 48%, #070D14 100%);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body class="bg-[#070D14] text-[#F8FAFC] antialiased selection:bg-[#38BDF8] selection:text-[#070D14]">
    <div id="root">
      <!-- Instant (<50ms) Fintech Dark Obsidian Slate & Royal Gold Shell before JS mounts -->
      <div class="kc-boot-shell" aria-label="Kifayat Connect">
        <img src="./pwa-192x192.png" width="96" height="96" alt="Kifayat Connect" style="border-radius:9999px;display:block;filter:drop-shadow(0 8px 22px rgba(212,175,55,0.34));" />
        <div style="margin-top:16px;font-size:18px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#F8FAFC;">KIFAYAT CONNECT</div>
        <div style="margin-top:6px;font-size:12px;font-weight:600;color:#38BDF8;">Together for a Better Tomorrow</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var isNative = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
        if (!isNative && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
          var reloadedOnUpdate = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!reloadedOnUpdate) {
              reloadedOnUpdate = true;
              window.location.reload();
            }
          });
          window.addEventListener('load', function () {
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  if (k.indexOf('kifayat-connect') === 0 && k !== 'kifayat-connect-v5.0.0') {
                    caches.delete(k).catch(function () {});
                  }
                });
              }).catch(function () {});
            }
            navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
              try { reg.update(); } catch (e) {}
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  try { reg.update(); } catch (e) {}
                }
              });
            }).catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
