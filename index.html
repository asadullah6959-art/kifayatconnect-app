    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;

        background-color: #E6F2FA;

      }
      .kc-boot-shell {
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
        background: radial-gradient(circle at 50% 22%, rgba(200, 164, 93, 0.2) 0%, #E6F2FA 48%, #FAF6EE 100%);

  <body class="bg-[#E6F2FA] text-[#102338] antialiased selection:bg-[#C8A45D] selection:text-[#102338]">
    <div id="root">
      <!-- Instant sky-and-ivory brand shell before React mounts -->
      <div class="kc-boot-shell" aria-label="SUI KHEL ITTEHAD">
        <img src="./kc-emblem.svg" width="96" height="96" alt="SUI KHEL ITTEHAD SKI" style="border-radius:9999px;display:block;filter:drop-shadow(0 8px 22px rgba(200,164,93,0.34));" />

      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var isNative = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
        if (!isNative && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
          window.addEventListener('load', function () {
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  if (k.indexOf('ski-connect-v') === 0) {
                    caches.delete(k).catch(function () {});
                  }
                });
              }).catch(function () {});
            }
            navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
              try { reg.update(); } catch (e) {}
              if (reg.waiting) {
                window.dispatchEvent(new CustomEvent('kc-sw-update-available', { detail: { registration: reg } }));
              }
              reg.addEventListener('updatefound', function () {
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('kc-sw-update-available', { detail: { registration: reg } }));
                  }
                });
              });
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  try { reg.update(); } catch (e) {}
                }
              });
            }).catch(function () {});
          });
        }
      })();
    </script>
  </body>
